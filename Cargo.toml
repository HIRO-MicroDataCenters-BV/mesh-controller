[workspace]
members = [
    "mesh",
    "mesh-kube-fake-api",
    "mesh-kube",
    "mesh-resource",
    "anyapplication",
]
resolver = "3"

[profile.release]
debug = true

[workspace.lints.rust]

[patch.crates-io]
iroh = { git = "https://github.com/ktatarnikovhiro/iroh.git", branch = "v0.34.1-patch" }
iroh-gossip = { git = "https://github.com/ktatarnikovhiro/iroh-gossip.git", branch = "v0.34.1-patch" }
iroh-base = { git = "https://github.com/ktatarnikovhiro/iroh.git", branch = "v0.34.1-patch" }
# netwatch = { package = "netwatch", git = "https://github.com/n0-computer/net-tools.git", tag = "netwatch-v0.7.0" }

# backporting memory leak fix https://github.com/n0-computer/quinn/pull/277/files
quinn = { package = "iroh-quinn", git = "https://github.com/ktatarnikovhiro/quinn.git", branch = "iroh-quinn-v0.13.0-patch" }
quinn-proto = { package = "iroh-quinn-proto", git = "https://github.com/ktatarnikovhiro/quinn.git", branch = "iroh-quinn-v0.13.0-patch" }
quinn-udp = { package = "iroh-quinn-udp", git = "https://github.com/ktatarnikovhiro/quinn.git", branch = "iroh-quinn-v0.13.0-patch" }

[workspace.dependencies]
# netwatch = "=0.7.0"
async-trait = "0.1.92"
anyhow = "1.0.104"
axum = "0.8.8"
axum-prometheus = "0.10.1"
bytes = "1.12.1"
hex = "0.4.3"
clap = { version = "4.6.6", features = ["derive"] }
ciborium = "0.2.2"
p2panda-core = { git = "https://github.com/p2panda/p2panda.git", tag="v0.4.0" }
p2panda-net = { git = "https://github.com/p2panda/p2panda.git", default-features = false, tag="v0.4.0" }
p2panda-sync = { git = "https://github.com/p2panda/p2panda.git", features = ["cbor", "log-sync"], default-features = false, tag="v0.4.0" }
p2panda-discovery = { git = "https://github.com/p2panda/p2panda.git", tag="v0.4.0" }
p2panda-store = { git = "https://github.com/p2panda/p2panda.git", features=["memory"], tag="v0.4.0" }
p2panda-stream = { git = "https://github.com/p2panda/p2panda.git", tag="v0.4.0" }
iroh-base = "0.34.1"
mesh = { path = "mesh" }
mesh-kube-fake-api = { path = "mesh-kube-fake-api" }
mesh-kube = { path = "mesh-kube" }
mesh-resource = { path = "mesh-resource" }
anyapplication = { path = "anyapplication" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_bw = "2.5.5"
futures-lite = "2.6.1"
futures-util = "0.3.34"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full", "tracing"] }
console-subscriber = { version = "0.5.0" }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
url = { version= "2.5.8" }
directories = "6.0.0"
figment = { version = "0.10.19", features = ["env", "yaml"] }
rand = "0.10.2"
loole = "0.4.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tempfile = "3.24.0"
rusty-hook = "^0.11.2"
once_cell = "1.21.3"
dashmap = "6.2.1"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
pin-project = "1.1.13"
hyper-util = { version = "0.1.20", features = [
    "server",
    "http1",
    "http2",
    "tokio",
] }
schemars = { version = "1.2.2" }
built = { version = "0.8.1", features = ["chrono", "git2"] }
strum = { version = "0.28.0", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json"] }
pin-project-lite = { version = "0.2.16" }
# pinned version of rusttls due to iroh-net
rustls = { version = "0.23.43" }
chrono = { version = "0.4.45" }
k8s-openapi = { version = "0.28", default-features = false, features = ["schemars", "v1_36"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "jsonpatch", "runtime", "derive", "rustls-tls", "runtime", "derive" ] }
jiff = { version = "0.2.35" }
either = { version = "1.17.0" }
tower-test = { version = "0.4.0" }
http = { version = "1.5.0" }
http-body = { version = "1.1.0" }
http-body-util = { version = "0.1.5" }
tower-service = { version = "0.3.3" }
regex = { version = "1.12.4" }
strum_macros = { version = "0.28.0" }
maplit = { version = "1.0.2" }
# pinned version due to vulnerability
openssl = "=0.10.81"
slab = "=0.4.12"
socket2 = "=0.6.4"
# cargo update -p socket2@0.6.4 --precise 0.6.4